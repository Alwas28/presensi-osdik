<style>
  :root{
    --umk-green:#006636; --umk-green-dark:#00381d;
    --umk-gold:#f3f005; --umk-red:#a10101;
    --paper:#f4f7f2; --ink:#122016; --ink-soft:#5b665d; --line:#e6ebe5;
  }
  html,body{ background:#e7ebe6; color:var(--ink); font-family:'Inter',sans-serif; }
  .display{ font-family:'Plus Jakarta Sans',sans-serif; }
  .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 14px; }
  .phone{
    position:relative; width:min(380px,92vw); aspect-ratio:380/800;
    background:#0d1a12; border-radius:46px; padding:12px;
    box-shadow:0 30px 60px -20px rgba(1,20,10,0.45), 0 4px 12px rgba(1,20,10,0.15);
  }
  .phone-notch{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:#0d1a12; border-radius:0 0 16px 16px; z-index:20;
  }
  .screen{ position:relative; height:100%; width:100%; background:#fff; border-radius:34px; overflow:hidden; display:flex; flex-direction:column; }
  .statusbar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 22px 6px; font-size:12px; font-weight:600; }
  .content{ flex:1; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none; }
  .content::-webkit-scrollbar{ display:none; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; }
  .pill{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em; }
  .pill-active{ background:#e2f4e6; color:#0a6b34; }
  .pill-closed{ background:#f2f2f2; color:#6b6b6b; }
  .pill-notyet{ background:#fdf3d8; color:#8a6a00; }
  .pill-done{ background:#e6eefc; color:#1d4ea0; }
  .navbar{ flex-shrink:0; position:relative; background:#fff; border-top:1px solid var(--line); height:66px; }
  .navrow{ display:flex; align-items:center; height:100%; }
  .navitem{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--ink-soft); }
  .navitem.active{ color:var(--umk-green); }
  .navitem i{ font-size:20px; }
  .navitem span{ font-size:10px; font-weight:600; }
  .navcenter{
    position:absolute; left:50%; top:0; transform:translate(-50%,-46%);
    width:56px; height:56px; border-radius:50%; background:var(--umk-green);
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 8px 16px -4px rgba(0,102,54,0.5), 0 0 0 5px #fff; cursor:pointer;
  }
  .navcenter i{ font-size:24px; }
  .chip{ font-size:11px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap; cursor:pointer; flex-shrink:0; }
  .chip.active{ background:var(--umk-green); border-color:var(--umk-green); color:#fff; }
  .checklist-item{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; color:var(--ink-soft); }
  .checklist-dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .checklist-item.done .checklist-dot{ background:var(--umk-green); border-color:var(--umk-green); color:#fff; }
  .checklist-item.done{ color:var(--ink); }
  .checklist-item.fail .checklist-dot{ background:var(--umk-red); border-color:var(--umk-red); color:#fff; }
  .checklist-item.fail{ color:var(--umk-red); }
  .viewfinder{ position:relative; aspect-ratio:1/1; background:#0d1a12; border-radius:20px; overflow:hidden; }
  .vf-corner{ position:absolute; width:26px; height:26px; border-color:var(--umk-gold); }
</style>
</head>

function timeToday(h,m){ var d = new Date(todayBase); d.setHours(h,m,0,0); return d.getTime(); }

var RIWAYAT = [
  { eventId:1, status:'hadir', ts: timeToday(8,2) }
];

var state = { tab:'beranda', presensiEventId: activeEventId(), scanning:false };

function activeEventId(){
  var ev = EVENTS.find(function(e){ return e.status === 'Aktif'; });
  return ev ? ev.id : EVENTS[0].id;
}
function eventById(id){ return EVENTS.find(function(e){ return e.id === id; }); }
function attendanceFor(id){ return RIWAYAT.find(function(r){ return r.eventId === id; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtClock(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

function statusPillClass(status){
  return { 'Aktif':'pill-active', 'Selesai':'pill-done', 'Belum Dibuka':'pill-notyet', 'Ditutup':'pill-closed' }[status] || 'pill-closed';
}
function initials(name){
  var p = name.trim().split(/\s+/);
  return p.length > 1 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

/* ---------- nav ---------- */
function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.navitem').forEach(function(el){ el.classList.toggle('active', el.dataset.tab === tab); });
  document.getElementById('navCenterBtn').style.background = tab === 'presensi' ? 'var(--umk-green-dark)' : 'var(--umk-green)';
  render();
  document.getElementById('screenContent').scrollTop = 0;
}
document.querySelectorAll('.navitem').forEach(function(el){ el.addEventListener('click', function(){ switchTab(el.dataset.tab); }); });
document.getElementById('navCenterBtn').addEventListener('click', function(){
  state.presensiEventId = state.presensiEventId || activeEventId();
  state.scanning = false;
  switchTab('presensi');
});

function render(){
  var c = document.getElementById('screenContent');
  if (state.tab === 'beranda') c.innerHTML = renderBeranda();
  if (state.tab === 'kegiatan') c.innerHTML = renderKegiatan();
  if (state.tab === 'presensi') c.innerHTML = renderPresensi();
  if (state.tab === 'riwayat') c.innerHTML = renderRiwayat();
  if (state.tab === 'profil') c.innerHTML = renderProfil();
  bindDynamicHandlers();
}

/* ---------- beranda ---------- */
function renderBeranda(){
  var ev = eventById(activeEventId());
  var att = attendanceFor(ev.id);
  var doneCount = RIWAYAT.length;
  var pct = Math.round(doneCount/EVENTS.length*100);
  var recent = RIWAYAT.slice().sort(function(a,b){ return b.ts-a.ts; }).slice(0,2);

  return '' +
  '<div class="p-5 pb-2">' +
    '<div class="flex items-center justify-between mb-5">' +
      '<div>' +
        '<p class="text-xs" style="color:var(--ink-soft);">Selamat datang,</p>' +
        '<p class="display font-bold text-base">' + STUDENT.name + '</p>' +
      '</div>' +
      '<div class="flex items-center justify-center rounded-full flex-shrink-0" style="width:38px;height:38px;background:#eef6f0;color:var(--umk-green);font-weight:700;font-size:13px;">' + initials(STUDENT.name) + '</div>' +
    '</div>' +

    '<div class="card p-4 mb-4" style="background:linear-gradient(135deg, var(--umk-green), var(--umk-green-dark)); border:none;">' +
      '<p class="text-xs mb-1" style="color:#bfe0c8;">Kegiatan saat ini</p>' +
      '<p class="display font-bold text-white text-sm mb-1">' + ev.nama + '</p>' +
      '<p class="text-xs mb-3" style="color:#bfe0c8;">' + ev.mulai + '&ndash;' + ev.selesai + ' &middot; ' + ev.lokasi + '</p>' +
      (att
        ? '<div class="flex items-center gap-1.5 text-xs font-semibold" style="color:#fff;"><i class="ti ti-circle-check"></i>Sudah presensi ' + fmtClock(att.ts) + '</div>'
        : '<button class="w-full py-2 rounded-lg text-sm font-semibold" style="background:var(--umk-gold); color:#3a3300;" onclick="goPresensi(' + ev.id + ')">Presensi sekarang</button>') +
    '</div>' +

    '<div class="grid grid-cols-2 gap-3 mb-4">' +
      '<div class="card p-3"><p class="text-xs mb-0.5" style="color:var(--ink-soft);">Kegiatan diikuti</p><p class="display font-bold text-lg">' + doneCount + ' / ' + EVENTS.length + '</p></div>' +
      '<div class="card p-3"><p class="text-xs mb-0.5" style="color:var(--ink-soft);">Kehadiran</p><p class="display font-bold text-lg" style="color:var(--umk-green);">' + pct + '%</p></div>' +
    '</div>' +

    '<div class="flex items-center justify-between mb-2">' +
      '<h3 class="font-semibold text-sm">Riwayat terbaru</h3>' +
      '<span class="text-xs font-semibold" style="color:var(--umk-green);" onclick="switchTab(\'riwayat\')">Lihat semua</span>' +
    '</div>' +
    '<div class="card overflow-hidden mb-5">' +
      (recent.length ? recent.map(function(r){
        var e = eventById(r.eventId);
        return '<div class="flex items-center justify-between p-3" style="border-bottom:1px solid var(--line);">' +
          '<div class="flex items-center gap-2.5 min-w-0">' +
            '<i class="ti ti-circle-check" style="color:var(--umk-green); font-size:18px; flex-shrink:0;"></i>' +
            '<div class="min-w-0"><p class="text-sm font-medium truncate">' + e.nama + '</p><p class="text-xs" style="color:var(--ink-soft);">' + e.tanggal + '</p></div>' +
          '</div>' +
          '<span class="text-xs flex-shrink-0" style="color:var(--ink-soft);">' + fmtClock(r.ts) + '</span>' +
        '</div>';
      }).join('') : '<p class="text-sm p-4" style="color:var(--ink-soft);">Belum ada riwayat presensi.</p>') +
    '</div>' +
  '</div>';
}
function goPresensi(id){ state.presensiEventId = id; state.scanning = false; switchTab('presensi'); }

/* ---------- kegiatan ---------- */
function renderKegiatan(){
  return '<div class="p-5 pb-2">' +
    '<h2 class="display font-bold text-base mb-1">Kegiatan PKKMB 2026</h2>' +
    '<p class="text-xs mb-4" style="color:var(--ink-soft);">Daftar rangkaian kegiatan penyambutan mahasiswa baru.</p>' +
    '<div class="space-y-3 pb-4">' +
    EVENTS.map(function(ev){
      var att = attendanceFor(ev.id);
      return '<div class="card p-4">' +
        '<div class="flex items-start justify-between mb-1.5">' +
          '<p class="font-semibold text-sm pr-2">' + ev.nama + '</p>' +
          '<span class="pill ' + statusPillClass(ev.status) + '">' + ev.status + '</span>' +
        '</div>' +
        '<p class="text-xs mb-3" style="color:var(--ink-soft);">' + ev.tanggal + ' &middot; ' + ev.mulai + '&ndash;' + ev.selesai + '<br>' + ev.lokasi + '</p>' +
        (att
          ? '<div class="flex items-center gap-1.5 text-xs font-semibold" style="color:var(--umk-green);"><i class="ti ti-circle-check"></i>Sudah presensi ' + fmtClock(att.ts) + '</div>'
          : ev.status === 'Aktif'
            ? '<button class="w-full py-2 rounded-lg text-xs font-semibold text-white" style="background:var(--umk-green);" onclick="goPresensi(' + ev.id + ')">Presensi sekarang</button>'
            : '<p class="text-xs" style="color:var(--ink-soft);">Presensi belum dapat dilakukan.</p>') +
      '</div>';
    }).join('') +
    '</div>' +
  '</div>';
}

/* ---------- presensi ---------- */
function renderPresensi(){
  var id = state.presensiEventId || activeEventId();
  var ev = eventById(id);
  var att = attendanceFor(id);

  var chips = EVENTS.map(function(e){
    return '<div class="chip ' + (e.id === id ? 'active' : '') + '" onclick="selectPresensiEvent(' + e.id + ')">' + e.nama.split(' ').slice(0,2).join(' ') + '</div>';
  }).join('');

  var body;
  if (att){
    body = '' +
      '<div class="flex flex-col items-center text-center py-8">' +
        '<div class="flex items-center justify-center rounded-full mb-4" style="width:56px;height:56px;background:#e7f3ea;"><i class="ti ti-circle-check" style="font-size:28px; color:var(--umk-green);"></i></div>' +
        '<p class="display font-bold text-sm mb-1">Sudah presensi</p>' +
        '<p class="text-xs" style="color:var(--ink-soft);">Kamu tercatat hadir pukul ' + fmtClock(att.ts) + '.</p>' +
      '</div>';
  } else if (ev.status !== 'Aktif'){
    body = '' +
      '<div class="flex flex-col items-center text-center py-8">' +
        '<div class="flex items-center justify-center rounded-full mb-4" style="width:56px;height:56px;background:#fdf3d8;"><i class="ti ti-lock" style="font-size:26px; color:#8a6a00;"></i></div>' +
        '<p class="display font-bold text-sm mb-1">Presensi belum dibuka</p>' +
        '<p class="text-xs" style="color:var(--ink-soft);">Panitia belum membuka presensi untuk kegiatan ini.</p>' +
      '</div>';
  } else if (state.scanning){
    body = '<div id="scanChecklist" class="py-3"></div>';
  } else {
    body = '' +
      '<div class="viewfinder mb-4">' +
        '<div class="vf-corner" style="top:14px; left:14px; border-top:3px solid var(--umk-gold); border-left:3px solid var(--umk-gold); border-radius:8px 0 0 0;"></div>' +
        '<div class="vf-corner" style="top:14px; right:14px; border-top:3px solid var(--umk-gold); border-right:3px solid var(--umk-gold); border-radius:0 8px 0 0;"></div>' +
        '<div class="vf-corner" style="bottom:14px; left:14px; border-bottom:3px solid var(--umk-gold); border-left:3px solid var(--umk-gold); border-radius:0 0 0 8px;"></div>' +
        '<div class="vf-corner" style="bottom:14px; right:14px; border-bottom:3px solid var(--umk-gold); border-right:3px solid var(--umk-gold); border-radius:0 0 8px 0;"></div>' +
        '<div class="absolute inset-0 flex items-center justify-center"><p class="text-xs" style="color:#7c9c85;">Arahkan kamera ke QR Code</p></div>' +
      '</div>' +
      '<button class="w-full py-2.5 rounded-lg text-sm font-semibold text-white mb-3" style="background:var(--umk-green);" onclick="startScan()">Scan QR</button>' +
      '<p class="text-xs text-center mb-3" style="color:var(--ink-soft);">atau masukkan token manual</p>' +
      '<div class="flex gap-2">' +
        '<input class="field-input flex-1" id="manualToken" placeholder="Kode token" style="border:1px solid var(--line); border-radius:9px; padding:8px 11px; font-size:13px;">' +
        '<button class="px-4 rounded-lg text-sm font-semibold text-white" style="background:var(--umk-green);" onclick="startScan()">Kirim</button>' +
      '</div>';
  }

  return '<div class="p-5 pb-2">' +
    '<h2 class="display font-bold text-base mb-3">Presensi</h2>' +
    '<div class="flex gap-2 overflow-x-auto pb-3 mb-3" style="scrollbar-width:none;">' + chips + '</div>' +
    '<div class="card p-4 mb-4">' +
      '<div class="flex items-center justify-between mb-1"><p class="font-semibold text-sm">' + ev.nama + '</p><span class="pill ' + statusPillClass(ev.status) + '">' + ev.status + '</span></div>' +
      '<p class="text-xs" style="color:var(--ink-soft);">' + ev.tanggal + ' &middot; ' + ev.mulai + '&ndash;' + ev.selesai + ' &middot; ' + ev.lokasi + '</p>' +
    '</div>' +
    '<div id="presensiBody">' + body + '</div>' +
  '</div>';
}
function selectPresensiEvent(id){ state.presensiEventId = id; state.scanning = false; render(); }
function startScan(){
  state.scanning = true;
  render();
  runValidation(state.presensiEventId);
}

function runValidation(eventId){
  var steps = [
    'Memindai QR Code',
    'Memvalidasi token',
    'Memeriksa waktu kegiatan',
    'Memeriksa duplikasi presensi',
    'Menyimpan presensi'
  ];
  var alreadyAttended = !!attendanceFor(eventId);
  var el = document.getElementById('scanChecklist');
  if (!el) return;
  el.innerHTML = steps.map(function(s){ return '<div class="checklist-item" data-step="' + s + '"><div class="checklist-dot"></div><span>' + s + '</span></div>'; }).join('');

  var delay = 500;
  steps.forEach(function(s, i){
    setTimeout(function(){
      var row = el.querySelector('[data-step="' + s + '"]');
      if (!row) return;
      if (s === 'Memeriksa duplikasi presensi' && alreadyAttended){
        row.classList.add('fail');
        row.querySelector('.checklist-dot').innerHTML = '<i class="ti ti-x"></i>';
        row.querySelector('span').textContent = 'Kamu sudah presensi kegiatan ini';
        setTimeout(function(){ state.scanning = false; render(); }, 1400);
        return;
      }
      row.classList.add('done');
      row.querySelector('.checklist-dot').innerHTML = '<i class="ti ti-check"></i>';
      if (i === steps.length - 1){
        RIWAYAT.push({ eventId: eventId, status:'hadir', ts: Date.now() });
        setTimeout(function(){ state.scanning = false; render(); }, 700);
      }
    }, delay * (i+1));
  });
}

/* ---------- riwayat ---------- */
function renderRiwayat(){
  var rows = RIWAYAT.slice().sort(function(a,b){ return b.ts-a.ts; });
  return '<div class="p-5 pb-2">' +
    '<h2 class="display font-bold text-base mb-1">Riwayat presensi</h2>' +
    '<p class="text-xs mb-4" style="color:var(--ink-soft);">' + rows.length + ' dari ' + EVENTS.length + ' kegiatan sudah kamu ikuti.</p>' +
    '<div class="card overflow-hidden mb-4">' +
      (rows.length ? rows.map(function(r){
        var e = eventById(r.eventId);
        return '<div class="flex items-center justify-between p-4" style="border-bottom:1px solid var(--line);">' +
          '<div class="flex items-center gap-3 min-w-0">' +
            '<i class="ti ti-circle-check" style="color:var(--umk-green); font-size:20px; flex-shrink:0;"></i>' +
            '<div class="min-w-0"><p class="text-sm font-medium truncate">' + e.nama + '</p><p class="text-xs" style="color:var(--ink-soft);">' + e.tanggal + '</p></div>' +
          '</div>' +
          '<span class="text-xs font-semibold flex-shrink-0" style="color:var(--ink-soft);">' + fmtClock(r.ts) + '</span>' +
        '</div>';
      }).join('') : '<p class="text-sm p-4" style="color:var(--ink-soft);">Belum ada riwayat.</p>') +
    '</div>' +
  '</div>';
}

/* ---------- profil ---------- */
function renderProfil(){
  return '<div class="p-5 pb-2">' +
    '<div class="flex flex-col items-center text-center py-4 mb-4">' +
      '<div class="flex items-center justify-center rounded-full mb-3" style="width:64px;height:64px;background:#eef6f0;color:var(--umk-green);font-weight:700;font-size:20px;">' + initials(STUDENT.name) + '</div>' +
      '<p class="display font-bold text-base">' + STUDENT.name + '</p>' +
      '<p class="text-xs" style="color:var(--ink-soft);">' + STUDENT.nim + '</p>' +
    '</div>' +
    '<div class="card p-4 mb-4">' +
      rowInfo('Program studi', STUDENT.prodi) +
      rowInfo('Fakultas', STUDENT.fakultas) +
      rowInfo('Angkatan', STUDENT.angkatan) +
    '</div>' +
    '<button class="w-full py-2.5 rounded-lg text-sm font-semibold" style="background:#fff; color:var(--umk-red); border:1px solid #f0c6c6;">Keluar</button>' +
  '</div>';
}
function rowInfo(label, val){
  return '<div class="flex justify-between py-2 text-sm" style="border-bottom:1px solid var(--line);"><span style="color:var(--ink-soft);">' + label + '</span><span class="font-medium text-right">' + val + '</span></div>';
}

function bindDynamicHandlers(){ /* reserved for future direct DOM bindings */ }

/* ---------- init ---------- */
switchTab('beranda');

</script>
</body>
</html>
